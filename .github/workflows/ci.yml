name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run repository checks
        run: |
          python -m pip install pre-commit==4.5.1
          pre-commit run --all-files --show-diff-on-failure
      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Test upgrade preflight
        run: bash tests/test_upgrade_guard.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: emailflow_ci
          POSTGRES_PASSWORD: emailflow-ci-fixture
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432/tcp
        options: >-
          --read-only
          --tmpfs /tmp
          --tmpfs /var/run/postgresql
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d emailflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests and PostgreSQL 16 migration check
        env:
          EMAILFLOW_TEST_DATABASE_URL: postgresql://postgres:emailflow-ci-fixture@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/emailflow_ci
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q backend/app embedding scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
