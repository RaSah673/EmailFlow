worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server_tokens off;
 access_log off;
 limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
   limit_req zone=api_rate burst=60 nodelay;
   limit_req_status 429;
   proxy_pass http://api:8000;
   proxy_http_version 1.1;
   proxy_connect_timeout 3s;
   proxy_read_timeout 60s;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
  }
 }
}
