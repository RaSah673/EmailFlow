apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: emailflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: emailflow-backend:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: emailflow-api
              key: DATABASE_URL
        - name: KAFKA_BOOTSTRAP
          value: kafka:9092
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel:4318
        - name: SERVICE_NAME
          value: emailflow-api
        - name: DB_POOL_SIZE
          value: '2'
        - name: AUTH_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: emailflow-auth
              key: AUTH_ENCRYPTION_KEY
        - name: EMBED_TOKEN
          valueFrom:
            secretKeyRef:
              name: emailflow-embed-token
              key: EMBED_TOKEN
        - name: APP_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: emailflow-config
              key: APP_ORIGIN
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 768Mi
        command:
        - uvicorn
        - app.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          periodSeconds: 5
          initialDelaySeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      terminationGracePeriodSeconds: 35
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
