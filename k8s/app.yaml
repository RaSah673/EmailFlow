apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: emailflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-observe
  namespace: emailflow
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-observe
  namespace: emailflow
subjects:
- kind: ServiceAccount
  name: api
  namespace: emailflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-observe
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: emailflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.9.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          name: broker
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka.emailflow.svc.cluster.local:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@127.0.0.1:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_HEAP_OPTS
          value: -Xms384m -Xmx768m
        - name: LOG_DIR
          value: /tmp/kafka-logs
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        - name: generated-config
          mountPath: /opt/kafka/config
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      securityContext:
        fsGroup: 1000
      volumes:
      - name: generated-config
        emptyDir:
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      automountServiceAccountToken: false
  serviceName: kafka
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: emailflow
spec:
  selector:
    app: kafka
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailcatcher
  namespace: emailflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailcatcher
  template:
    metadata:
      labels:
        app: mailcatcher
    spec:
      containers:
      - name: mailcatcher
        image: sj26/mailcatcher:v0.10.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 1080
          name: http
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: temp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 16Mi
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      automountServiceAccountToken: false
---
