apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: emailflow
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 24
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 12
            periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.emailflow.svc.cluster.local:9092
      # Discover both topics from the shared group, which always has a minimum replica.
      consumerGroup: emailflow-workers
      lagThreshold: '100'
      offsetResetPolicy: earliest
